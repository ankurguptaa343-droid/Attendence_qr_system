<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Admin</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f1f5f9;color:#0f172a}main{max-width:720px;margin:0 auto;padding:16px}.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 10px #0001;margin-bottom:16px}input,select,button{font:inherit;width:100%;padding:14px;border-radius:10px;border:1px solid #cbd5e1;margin:6px 0}button{background:#4f46e5;color:#fff;border:0;font-weight:600;cursor:pointer;min-height:48px}button.alt{background:#e2e8f0;color:#0f172a}.err{color:#b91c1c}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:#eef2ff;border-radius:12px;padding:12px;text-align:center}.stat b{font-size:1.6em;display:block}img.qr{width:100%;max-width:320px;display:block;margin:12px auto}.res{border-radius:16px;padding:20px;text-align:center;margin-top:10px}.success{background:#dcfce7}.duplicate{background:#fef9c3}.invalid,.error{background:#fee2e2}.tab{display:flex;gap:6px;overflow-x:auto}.tab button{width:auto;white-space:nowrap}.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px;border-bottom:1px solid #e2e8f0;text-align:left}</style><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script></head><body><main>
<div class="card" id="login"><h2>Admin Login</h2><input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password"><button id="lg">Login</button><p id="le" class="err"></p></div>
<div id="app" hidden>
<div class="tab"><button data-t="dash">Dashboard</button><button data-t="scan" class="alt">Scanner</button><button data-t="live" class="alt">Live Present</button><button data-t="walk" class="alt">Walk-in</button><button data-t="ev" class="alt">Events</button><button data-t="imp" class="alt">Import</button><button id="lo" class="alt">Logout</button></div>
<div class="card"><label>Active event</label><select id="evsel"></select></div>
<section id="dash" class="card"><div class="grid" id="stats"></div><input id="q" placeholder="Search name/email"><select id="f"><option value="">All</option><option value="present">Present</option><option value="absent">Absent</option></select><div class="grid"><button id="bp">Present list</button><button id="ba" class="alt">Absent list</button></div><button id="ex">Export Excel (current list)</button><div class="tw"><table id="tb"></table></div></section>
<section id="live" class="card" hidden style="text-align:center"><h3>Live Present Count</h3><div style="font-size:72px;font-weight:800;color:#16a34a" id="lc">0</div><div id="lt" style="font-size:20px"></div><div class="tw"><table id="ll"></table></div></section>
<section id="walk" class="card" hidden><h3>Walk-in Registration</h3><input id="wn" placeholder="Full name"><input id="wp" placeholder="Phone (optional)" inputmode="tel"><input id="we" type="email" placeholder="Email (optional)"><label style="display:flex;gap:8px;align-items:center"><input id="wm" type="checkbox" checked style="width:auto;margin:0"> Mark present for the selected event</label><button id="wb">Register &amp; Generate QR</button><p id="wmsg"></p><div id="wout" hidden style="text-align:center"><canvas id="wq" style="width:100%;max-width:320px"></canvas><button id="wd">Download QR</button><button class="alt" id="wpr">Print QR</button></div></section>
<section id="scan" class="card" hidden><h3>Attendance Scanner</h3><div id="reader" style="width:100%"></div><button id="sc">Start Camera</button><div id="res"></div></section>
<section id="ev" class="card" hidden><h3>Events</h3><input id="en" placeholder="Event name"><input id="ed" type="date"><input id="el" placeholder="Location"><button id="ec">Create Event</button><div id="evl"></div></section>
<section id="imp" class="card" hidden><h3>Import Excel / CSV</h3><input id="fi" type="file" accept=".xlsx,.xls,.csv"><select id="mode"><option value="merge">Merge Import</option><option value="replace">Replace Master List</option></select><button id="ib">Import</button><pre id="ir"></pre></section>
</div>
<script>
const $=i=>document.getElementById(i);let EV=[],busy=false,scanner;let LT;let WU;
window.okRes=()=>{$('res').innerHTML='';busy=false};
function drawWQ(src,name){const im=new Image();im.onload=()=>{const c=$('wq'),x=c.getContext('2d'),w=im.width,hh=im.height+110;c.width=w;c.height=hh;x.fillStyle='#fff';x.fillRect(0,0,w,hh);x.drawImage(im,0,0);x.fillStyle='#0f172a';x.textAlign='center';let fs=48;x.font='bold '+fs+'px sans-serif';while(x.measureText(name).width>w-40&&fs>16){fs-=2;x.font='bold '+fs+'px sans-serif'}x.fillText(name,w/2,im.height+60);WU=c.toDataURL('image/png')};im.src=src}
$('wb').onclick=async()=>{$('wb').disabled=true;try{const r=await api('/admin/participants',{method:'POST',body:JSON.stringify({name:$('wn').value,phone:$('wp').value,email:$('we').value,eventId:$('wm').checked?(+$('evsel').value||null):null})});const d=await r.json();
if(!r.ok){$('wmsg').textContent=d.error;$('wout').hidden=true}else{$('wmsg').textContent=(d.existed?'Already registered. ':'Registered. ')+(d.marked?'Marked present. ':'')+(d.note||'');drawWQ(d.qr,d.name);$('wout').hidden=false;if(!d.existed)['wn','wp','we'].forEach(i=>$(i).value='')}}catch{$('wmsg').textContent='Network error.'}$('wb').disabled=false};
$('wd').onclick=()=>{const a=document.createElement('a');a.href=WU;a.download='qr.png';a.click()};
$('wpr').onclick=()=>{const w=window.open('');w.document.write('<img src="'+WU+'" style="width:100%;max-width:400px">');w.document.close();w.focus();w.print()};
function countTo(el,n){let c=+el.textContent||0;clearInterval(el._t);el._t=setInterval(()=>{if(c===n)return clearInterval(el._t);c+=c<n?1:-1;el.textContent=c},50)}
async function live(){const ev=$('evsel').value;if(!ev)return;try{const s=await(await api('/attendance/stats?eventId='+ev)).json();const rows=await(await api('/attendance?eventId='+ev+'&status=present')).json();
countTo($('lc'),s.present);$('lt').textContent='present out of '+s.total+' ('+s.percent+'%)';
$('ll').innerHTML='<tr><th>#</th><th>Name</th><th>Email</th><th>Time</th></tr>'+rows.map((r,i)=>'<tr><td>'+(rows.length-i)+'</td><td>'+esc(r.name)+'</td><td>'+esc(r.email)+'</td><td>'+new Date(r.marked_at).toLocaleTimeString()+'</td></tr>').join('')}catch{}}
const api=async(p,o={})=>{const r=await fetch('/api'+p,{credentials:'same-origin',...o,headers:o.body&&!(o.body instanceof FormData)?{'Content-Type':'application/json'}:undefined});if(r.status===401&&p!=='/auth/admin/login'){show(false)}return r};
const show=ok=>{$('login').hidden=ok;$('app').hidden=!ok;if(ok)init()};
$('lg').onclick=async()=>{const r=await api('/auth/admin/login',{method:'POST',body:JSON.stringify({email:$('em').value,password:$('pw').value})});r.ok?show(true):$('le').textContent=(await r.json()).error};
$('lo').onclick=async()=>{await api('/auth/logout',{method:'POST'});location.reload()};
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{['dash','scan','live','walk','ev','imp'].forEach(t=>$(t).hidden=t!==b.dataset.t);if(b.dataset.t!=='scan')stop();clearInterval(LT);if(b.dataset.t==='dash')load();if(b.dataset.t==='live'){live();LT=setInterval(live,3000)}});
async function init(){await loadEv();load()}
async function loadEv(){EV=await(await api('/events')).json();$('evsel').innerHTML=EV.map(e=>'<option value="'+e.id+'">'+esc(e.name)+' ('+e.status+')</option>').join('');
$('evl').innerHTML=EV.map(e=>'<p>'+esc(e.name)+' – '+e.status+' <button class="alt" onclick="tog('+e.id+',\''+e.status+'\')">'+(e.status==='open'?'Close':'Open')+'</button> <button class="alt" style="color:#b91c1c" onclick="delEv('+e.id+')">Delete</button></p>').join('')||'<p>No events yet.</p>'}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
window.delEv=async id=>{const e=EV.find(x=>x.id===id);if(!confirm('Delete "'+e.name+'"?\n\nAll attendance records of this event will be permanently deleted. Participants are NOT deleted.'))return;const r=await api('/events/'+id,{method:'DELETE'});if(r.ok){await loadEv();load()}else alert('Could not delete')};
window.tog=async(id,s)=>{await api('/events/'+id,{method:'PATCH',body:JSON.stringify({status:s==='open'?'closed':'open'})});loadEv()};
$('ec').onclick=async()=>{const r=await api('/events',{method:'POST',body:JSON.stringify({name:$('en').value,date:$('ed').value,location:$('el').value})});if(r.ok){$('en').value='';loadEv()}else alert((await r.json()).error)};
$('evsel').onchange=load;$('q').oninput=load;$('f').onchange=load;
const qs=()=>'eventId='+$('evsel').value+'&search='+encodeURIComponent($('q').value)+'&status='+$('f').value;
async function load(){if(!$('evsel').value)return;const s=await(await api('/attendance/stats?eventId='+$('evsel').value)).json();
$('stats').innerHTML=[['Registered',s.total],['Present',s.present],['Absent',s.absent],['Attendance',s.percent+'%'],['Events',s.events]].map(x=>'<div class="stat"><b>'+x[1]+'</b>'+x[0]+'</div>').join('');
const rows=await(await api('/attendance?'+qs())).json();$('tb').innerHTML='<tr><th>Name</th><th>Email</th><th>Status</th><th>Time</th></tr>'+(rows.map(r=>'<tr><td>'+esc(r.name)+'</td><td>'+esc(r.email)+'</td><td>'+r.status+'</td><td>'+(r.marked_at?new Date(r.marked_at).toLocaleTimeString():'')+'</td></tr>').join('')||'<tr><td colspan=4>No participants. Import an Excel file.</td></tr>')}
$('bp').onclick=()=>{$('f').value='present';load()};$('ba').onclick=()=>{$('f').value='absent';load()};
$('ex').onclick=()=>location.href='/api/admin/export?'+qs();
async function stop(){try{if(scanner){await scanner.stop();scanner=null}}catch{}}
$('sc').onclick=async()=>{busy=false;$('res').innerHTML='';await stop();scanner=new Html5Qrcode('reader');
scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:250,height:250}},async txt=>{if(busy)return;busy=true;
try{const r=await api('/attendance/scan',{method:'POST',body:JSON.stringify({token:txt,eventId:+$('evsel').value})});const d=await r.json();
const t=d.time?new Date(d.time).toLocaleTimeString():'';const h={success:'✓ Attendance Marked',duplicate:'Already Present',invalid:'✕ Invalid QR',error:'✕ Error'}[d.status]||'✕ Error';
$('res').innerHTML='<div class="res '+(d.status||'error')+'"><h2>'+h+'</h2>'+(d.name?'<h3>'+esc(d.name)+'</h3><p>'+esc(d.email)+'</p><p>'+t+'</p>':'')+'<p>'+esc(d.message||'')+'</p><button onclick="okRes()" style="background:#0f172a;margin-top:12px">OK</button></div>'}
catch{$('res').innerHTML='<div class="res error"><h2>Connection lost</h2><p>Attendance could not be verified.</p><button onclick="okRes()" style="background:#0f172a;margin-top:12px">OK</button></div>'}
$('res').scrollIntoView({behavior:'smooth',block:'center'})},()=>{}).catch(e=>$('res').textContent='Camera error: '+e)};
$('ib').onclick=async()=>{const f=$('fi').files[0];if(!f)return alert('Choose a file');const m=$('mode').value;
if(m==='replace'&&!confirm('This DELETES all existing participants (and their attendance). Continue?'))return;
const fd=new FormData();fd.append('mode',m);fd.append('confirm','yes');fd.append('file',f);const r=await api('/admin/import',{method:'POST',body:fd});const d=await r.json();
$('ir').textContent=r.ok?'Total rows: '+d.total+'\n✓ Imported: '+d.imported+'\n✓ Updated: '+d.updated+'\n⚠ Duplicates: '+d.duplicates+'\n⚠ Invalid emails: '+d.invalidEmails+'\n⚠ Missing data: '+d.missing:d.error};
api('/auth/me').then(r=>show(r.ok));
</script></main></body></html>
