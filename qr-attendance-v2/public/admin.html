<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Admin</title><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--bg:#f3f5fb;--card:#fff;--ink:#0f172a;--mute:#64748b;--line:#e5e9f2;--brand:#4f46e5;--brand2:#7c3aed;--ok:#16a34a;--okbg:#dcfce7;--no:#b45309;--nobg:#fef3c7}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top,0px)) 20px 70px;background:radial-gradient(700px 300px at 10% -20%,#6366f1aa,transparent 60%),linear-gradient(135deg,#0f172a,#1e1b4b);color:#fff}
.top small{display:block;font-size:11px;letter-spacing:.2em;color:#a5b4fc;font-weight:600}.top b{font-size:22px;font-weight:800;letter-spacing:-.02em}
.pill{padding:6px 12px;border-radius:999px;background:#ffffff1f;border:1px solid #ffffff33;font-size:12px;font-weight:600}
main{max-width:980px;margin:-52px auto 0;padding:0 14px 40px;position:relative}
.card{background:var(--card);border-radius:20px;padding:20px;box-shadow:0 8px 28px -10px #1e1b4b2e;margin-bottom:14px;border:1px solid #eef0f7}
h2,h3{margin:0 0 14px;font-weight:700;letter-spacing:-.01em}h3{font-size:18px}
.muted{color:var(--mute);font-size:14px;margin:-8px 0 14px}
label{display:block;font-size:13px;font-weight:600;color:#475569;margin-bottom:6px}
input,select,button{font:inherit;width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);margin:5px 0;background:#f8fafc;color:var(--ink);outline:0;transition:.15s}
input:focus,select:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 4px #4f46e51f}
button{border:0;cursor:pointer;font-weight:700;min-height:48px;color:#fff;background:linear-gradient(135deg,var(--brand),var(--brand2));box-shadow:0 8px 18px -8px #4f46e5aa}
button:active{transform:scale(.98)}button:disabled{opacity:.6}
button.alt{background:#eef1f8;color:#334155;box-shadow:none}
.tab{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;position:sticky;top:0;z-index:5;scrollbar-width:none}.tab::-webkit-scrollbar{display:none}
.tab button{width:auto;white-space:nowrap;padding:10px 16px;min-height:42px;border-radius:999px;margin:0;font-size:14px}
.tab button.alt{background:#fff;border:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
#stats{grid-template-columns:repeat(auto-fit,minmax(135px,1fr));margin-bottom:14px}
.stat{border-radius:16px;padding:14px;color:#fff}.stat b{display:block;font-size:30px;font-weight:800;line-height:1.1}.stat span{font-size:12px;font-weight:600;opacity:.9;letter-spacing:.04em;text-transform:uppercase}
.c0{background:linear-gradient(135deg,#6366f1,#4f46e5)}.c1{background:linear-gradient(135deg,#22c55e,#15803d)}.c2{background:linear-gradient(135deg,#f59e0b,#d97706)}.c3{background:linear-gradient(135deg,#06b6d4,#0e7490)}.c4{background:linear-gradient(135deg,#a855f7,#7e22ce)}
.bar{display:grid;grid-template-columns:1fr;gap:8px}@media(min-width:640px){.bar{grid-template-columns:1fr 160px}}
.tw{overflow:auto;max-height:60vh;margin-top:10px;border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;font-size:14px}th{position:sticky;top:0;background:#f8fafc;text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute)}
td,th{padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}tr:last-child td{border-bottom:0}tr:hover td{background:#fafbff}
.b{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700}.b.ok{background:var(--okbg);color:#166534}.b.no{background:var(--nobg);color:var(--no)}
.evr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.acts{display:flex;gap:8px}.acts button{width:auto;margin:0;padding:8px 14px;min-height:38px}
.empty{color:var(--mute);text-align:center;padding:16px}
.err{color:#b91c1c;font-size:14px}
#login{max-width:420px;margin:12px auto}
#reader{border-radius:16px;overflow:hidden;margin:6px 0}
.res{border-radius:20px;padding:22px;text-align:center;margin-top:12px;animation:pop .3s ease}.res h2{font-size:26px;margin-bottom:8px}.res p{margin:4px 0}
.success{background:var(--okbg);color:#14532d}.duplicate{background:var(--nobg);color:#78350f}.invalid,.error{background:#fee2e2;color:#7f1d1d}
#lc{font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#ef4444;margin-right:8px;animation:pl 1.2s infinite}
pre{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:12px;white-space:pre-wrap;font-family:inherit}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}@keyframes pl{50%{opacity:.25}}
@media(min-width:768px){.card{padding:26px}main{padding:0 24px 48px}}
</style><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script></head><body><header class="top"><div><small>VISION CSE</small><b>CodeCrux 2.0</b></div><span class="pill">Admin Portal</span></header><main>
<div class="card" id="login"><h2>Welcome back</h2><p class="muted">Sign in to manage attendance</p><input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password"><button id="lg">Login</button><p id="le" class="err"></p></div>
<div id="app" hidden>
<div class="tab"><button data-t="dash">Dashboard</button><button data-t="scan" class="alt">Scanner</button><button data-t="live" class="alt">Live Present</button><button data-t="walk" class="alt">Walk-in</button><button data-t="ev" class="alt">Events</button><button data-t="imp" class="alt">Import</button><button id="lo" class="alt">Logout</button></div>
<div class="card"><label>Active event</label><select id="evsel"></select></div>
<section id="dash" class="card"><div class="grid" id="stats"></div><div class="bar"><input id="q" placeholder="🔍 Search name or email"><select id="f"><option value="">All</option><option value="present">Present</option><option value="absent">Absent</option></select></div><div class="grid"><button id="bp">Present list</button><button id="ba" class="alt">Absent list</button></div><button id="ex" class="alt">Export Excel (current list)</button><div class="tw"><table id="tb"></table></div></section>
<section id="live" class="card" hidden style="text-align:center"><h3><span class="dot"></span>Live Present Count</h3><div style="font-size:84px;font-weight:800;line-height:1;color:#16a34a" id="lc">0</div><div id="lt" style="font-size:20px"></div><div class="tw"><table id="ll"></table></div></section>
<section id="walk" class="card" hidden><h3>Walk-in Registration</h3><input id="wn" placeholder="Full name"><input id="wp" placeholder="Phone (optional)" inputmode="tel"><input id="we" type="email" placeholder="Email (optional)"><label style="display:flex;gap:8px;align-items:center"><input id="wm" type="checkbox" checked style="width:auto;margin:0"> Mark present for the selected event</label><button id="wb">Register &amp; Generate QR</button><p id="wmsg"></p><div id="wout" hidden style="text-align:center"><canvas id="wq" style="width:100%;max-width:320px"></canvas><button id="wd">Download QR</button><button class="alt" id="wpr">Print QR</button></div></section>
<section id="scan" class="card" hidden><h3>Attendance Scanner</h3><div id="reader" style="width:100%"></div><button id="sc">Start Camera</button><div id="res"></div></section>
<section id="ev" class="card" hidden><h3>Events</h3><input id="en" placeholder="Event name"><input id="ed" type="date"><input id="el" placeholder="Location"><button id="ec">Create Event</button><div id="evl"></div></section>
<section id="imp" class="card" hidden><h3>Import Excel / CSV</h3><input id="fi" type="file" accept=".xlsx,.xls,.csv"><select id="mode"><option value="merge">Merge Import</option><option value="replace">Replace Master List</option></select><button id="ib">Import</button><pre id="ir"></pre></section>
</div>
<script>
const $=i=>document.getElementById(i);let EV=[],busy=false,scanner;let LT;let WU;
window.okRes=()=>{$('res').innerHTML='';busy=false};
function drawWQ(src,name){const im=new Image();im.onload=()=>{const c=$('wq'),x=c.getContext('2d'),w=im.width,hh=im.height+110;c.width=w;c.height=hh;x.fillStyle='#fff';x.fillRect(0,0,w,hh);x.drawImage(im,0,0);x.fillStyle='#0f172a';x.textAlign='center';let fs=48;x.font='bold '+fs+'px sans-serif';while(x.measureText(name).width>w-40&&fs>16){fs-=2;x.font='bold '+fs+'px sans-serif'}x.fillText(name,w/2,im.height+60);WU=c.toDataURL('image/png')};im.src=src}
$('wb').onclick=async()=>{$('wb').disabled=true;try{const r=await api('/admin/participants',{method:'POST',body:JSON.stringify({name:$('wn').value,phone:$('wp').value,email:$('we').value,eventId:$('wm').checked?(+$('evsel').value||null):null})});const d=await r.json();
if(!r.ok){$('wmsg').textContent=d.error;$('wout').hidden=true}else{$('wmsg').textContent=(d.existed?'Already registered. ':'Registered. ')+(d.marked?'Marked present. ':'')+(d.note||'');drawWQ(d.qr,d.name);$('wout').hidden=false;if(!d.existed)['wn','wp','we'].forEach(i=>$(i).value='')}}catch{$('wmsg').textContent='Network error.'}$('wb').disabled=false};
$('wd').onclick=()=>{const a=document.createElement('a');a.href=WU;a.download='qr.png';a.click()};
$('wpr').onclick=()=>{const w=window.open('');w.document.write('<img src="'+WU+'" style="width:100%;max-width:400px">');w.document.close();w.focus();w.print()};
function countTo(el,n){let c=+el.textContent||0;clearInterval(el._t);el._t=setInterval(()=>{if(c===n)return clearInterval(el._t);c+=c<n?1:-1;el.textContent=c},50)}
async function live(){const ev=$('evsel').value;if(!ev)return;try{const s=await(await api('/attendance/stats?eventId='+ev)).json();const rows=await(await api('/attendance?eventId='+ev+'&status=present')).json();
countTo($('lc'),s.present);$('lt').textContent='present out of '+s.total+' ('+s.percent+'%)';
$('ll').innerHTML='<tr><th>#</th><th>Name</th><th>Email</th><th>Time</th></tr>'+rows.map((r,i)=>'<tr><td>'+(rows.length-i)+'</td><td>'+esc(r.name)+'</td><td>'+esc(r.email)+'</td><td>'+new Date(r.marked_at).toLocaleTimeString()+'</td></tr>').join('')}catch{}}
const api=async(p,o={})=>{const r=await fetch('/api'+p,{credentials:'same-origin',...o,headers:o.body&&!(o.body instanceof FormData)?{'Content-Type':'application/json'}:undefined});if(r.status===401&&p!=='/auth/admin/login'){show(false)}return r};
const show=ok=>{$('login').hidden=ok;$('app').hidden=!ok;if(ok)init()};
$('lg').onclick=async()=>{const r=await api('/auth/admin/login',{method:'POST',body:JSON.stringify({email:$('em').value,password:$('pw').value})});r.ok?show(true):$('le').textContent=(await r.json()).error};
$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')$('lg').click()});
$('lo').onclick=async()=>{await api('/auth/logout',{method:'POST'});location.reload()};
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab [data-t]').forEach(x=>x.classList.toggle('alt',x!==b));['dash','scan','live','walk','ev','imp'].forEach(t=>$(t).hidden=t!==b.dataset.t);if(b.dataset.t!=='scan')stop();clearInterval(LT);if(b.dataset.t==='dash')load();if(b.dataset.t==='live'){live();LT=setInterval(live,3000)}});
async function init(){await loadEv();load()}
async function loadEv(){EV=await(await api('/events')).json();$('evsel').innerHTML=EV.map(e=>'<option value="'+e.id+'">'+esc(e.name)+' ('+e.status+')</option>').join('');
$('evl').innerHTML=EV.map(e=>'<div class="evr"><div><b>'+esc(e.name)+'</b> <span class="b '+(e.status==='open'?'ok':'no')+'">'+e.status+'</span></div><div class="acts"><button class="alt" onclick="tog('+e.id+',\''+e.status+'\')">'+(e.status==='open'?'Close':'Open')+'</button> <button class="alt" style="color:#b91c1c" onclick="delEv('+e.id+')">Delete</button></div></div>').join('')||'<p class="empty">No events yet. Create one above.</p>'}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
window.delEv=async id=>{const e=EV.find(x=>x.id===id);if(!confirm('Delete "'+e.name+'"?\n\nAll attendance records of this event will be permanently deleted. Participants are NOT deleted.'))return;const r=await api('/events/'+id,{method:'DELETE'});if(r.ok){await loadEv();load()}else alert('Could not delete')};
window.tog=async(id,s)=>{await api('/events/'+id,{method:'PATCH',body:JSON.stringify({status:s==='open'?'closed':'open'})});loadEv()};
$('ec').onclick=async()=>{const r=await api('/events',{method:'POST',body:JSON.stringify({name:$('en').value,date:$('ed').value,location:$('el').value})});if(r.ok){$('en').value='';loadEv()}else alert((await r.json()).error)};
$('evsel').onchange=load;$('q').oninput=load;$('f').onchange=load;
const qs=()=>'eventId='+$('evsel').value+'&search='+encodeURIComponent($('q').value)+'&status='+$('f').value;
async function load(){if(!$('evsel').value)return;const s=await(await api('/attendance/stats?eventId='+$('evsel').value)).json();
$('stats').innerHTML=[['Registered',s.total],['Present',s.present],['Absent',s.absent],['Attendance',s.percent+'%'],['Events',s.events]].map((x,i)=>'<div class="stat c'+i+'"><b>'+x[1]+'</b><span>'+x[0]+'</span></div>').join('');
const rows=await(await api('/attendance?'+qs())).json();$('tb').innerHTML='<tr><th>Name</th><th>Email</th><th>Status</th><th>Time</th></tr>'+(rows.map(r=>'<tr><td>'+esc(r.name)+'</td><td>'+esc(r.email)+'</td><td><span class="b '+(r.status==='Present'?'ok':'no')+'">'+r.status+'</span></td><td>'+(r.marked_at?new Date(r.marked_at).toLocaleTimeString():'')+'</td></tr>').join('')||'<tr><td colspan=4>No participants. Import an Excel file.</td></tr>')}
$('bp').onclick=()=>{$('f').value='present';load()};$('ba').onclick=()=>{$('f').value='absent';load()};
$('ex').onclick=()=>location.href='/api/admin/export?'+qs();
async function stop(){try{if(scanner){await scanner.stop();scanner=null}}catch{}}
$('sc').onclick=async()=>{busy=false;$('res').innerHTML='';await stop();scanner=new Html5Qrcode('reader');
scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:250,height:250}},async txt=>{if(busy)return;busy=true;
try{const r=await api('/attendance/scan',{method:'POST',body:JSON.stringify({token:txt,eventId:+$('evsel').value})});const d=await r.json();
const t=d.time?new Date(d.time).toLocaleTimeString():'';const h={success:'✓ Attendance Marked',duplicate:'Already Present',invalid:'✕ Invalid QR',error:'✕ Error'}[d.status]||'✕ Error';
$('res').innerHTML='<div class="res '+(d.status||'error')+'"><h2>'+h+'</h2>'+(d.name?'<h3>'+esc(d.name)+'</h3><p>'+esc(d.email)+'</p><p>'+t+'</p>':'')+'<p>'+esc(d.message||'')+'</p><button onclick="okRes()" style="background:#0f172a;margin-top:12px">OK</button></div>'}
catch{$('res').innerHTML='<div class="res error"><h2>Connection lost</h2><p>Attendance could not be verified.</p><button onclick="okRes()" style="background:#0f172a;margin-top:12px">OK</button></div>'}
$('res').scrollIntoView({behavior:'smooth',block:'center'})},()=>{}).catch(e=>$('res').textContent='Camera error: '+e)};
$('ib').onclick=async()=>{const f=$('fi').files[0];if(!f)return alert('Choose a file');const m=$('mode').value;
if(m==='replace'&&!confirm('This DELETES all existing participants (and their attendance). Continue?'))return;
const fd=new FormData();fd.append('mode',m);fd.append('confirm','yes');fd.append('file',f);const r=await api('/admin/import',{method:'POST',body:fd});const d=await r.json();
$('ir').textContent=r.ok?'Total rows: '+d.total+'\n✓ Imported: '+d.imported+'\n✓ Updated: '+d.updated+'\n⚠ Duplicates: '+d.duplicates+'\n⚠ Invalid emails: '+d.invalidEmails+'\n⚠ Missing data: '+d.missing:d.error};
api('/auth/me').then(r=>show(r.ok));
</script></main></body></html>
