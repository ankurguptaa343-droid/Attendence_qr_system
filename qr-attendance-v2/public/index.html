<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Get Your Attendance QR</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f1f5f9;color:#0f172a}main{max-width:720px;margin:0 auto;padding:16px}.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 10px #0001;margin-bottom:16px}input,select,button{font:inherit;width:100%;padding:14px;border-radius:10px;border:1px solid #cbd5e1;margin:6px 0}button{background:#4f46e5;color:#fff;border:0;font-weight:600;cursor:pointer;min-height:48px}button.alt{background:#e2e8f0;color:#0f172a}.err{color:#b91c1c}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:#eef2ff;border-radius:12px;padding:12px;text-align:center}.stat b{font-size:1.6em;display:block}img.qr{width:100%;max-width:320px;display:block;margin:12px auto}.res{border-radius:16px;padding:20px;text-align:center;margin-top:10px}.success{background:#dcfce7}.duplicate{background:#fef9c3}.invalid,.error{background:#fee2e2}.tab{display:flex;gap:6px;overflow-x:auto}.tab button{width:auto;white-space:nowrap}.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px;border-bottom:1px solid #e2e8f0;text-align:left}</style></head><body><main>
<div class="card"><h2>Get Your Attendance QR</h2><label for="e">Registered Email</label><input id="e" type="email" autocomplete="email" placeholder="you@example.com"><button id="go">Generate My QR</button><p id="msg" class="err"></p></div>
<div class="card" id="out" hidden style="text-align:center"><h3 id="n"></h3><div id="m"></div><canvas id="qr" style="width:100%;max-width:320px;display:block;margin:12px auto"></canvas><button id="dl">Download QR</button><button class="alt" onclick="print()">Print QR</button><p>Show this QR at the attendance counter.</p><div id="st"></div></div>
<script>
const $=i=>document.getElementById(i);let url;
function drawQR(src,name){const im=new Image();im.onload=()=>{const c=$('qr'),x=c.getContext('2d'),w=im.width,h=im.height+110;c.width=w;c.height=h;x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0);x.fillStyle='#0f172a';x.textAlign='center';let fs=48;x.font='bold '+fs+'px sans-serif';while(x.measureText(name).width>w-40&&fs>16){fs-=2;x.font='bold '+fs+'px sans-serif'}x.fillText(name,w/2,im.height+60);url=c.toDataURL('image/png')};im.src=src}
$('go').onclick=async()=>{$('msg').textContent='';$('out').hidden=true;$('go').disabled=true;$('go').textContent='Checking…';
try{const r=await fetch('/api/participants/verify-email',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('e').value})});const d=await r.json();
if(!r.ok)$('msg').textContent=d.error;else{$('n').textContent=d.name;$('m').textContent=d.email;drawQR(d.qr,d.name);
$('st').textContent=d.attendance.length?d.attendance.map(a=>'Present – '+a.name+' at '+new Date(a.marked_at).toLocaleTimeString()).join(' | '):'Attendance Status: Not Marked';$('out').hidden=false}}
catch{$('msg').textContent='Network error. Try again.'}$('go').disabled=false;$('go').textContent='Generate My QR'};
$('dl').onclick=()=>{const a=document.createElement('a');a.href=url;a.download='my-attendance-qr.png';a.click()};
</script></main></body></html>
